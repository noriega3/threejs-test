<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EDM Laser Show Simulation</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 0);
    camera.lookAt(0, 5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);

    const laserCount = 25;
    const lasers = [];
    const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff,0xff0000, 0x00ff00, 0x0000ff]; // Red, Green, Blue

    // Create laser beams
    for (let i = 0; i < laserCount; i++) {
      const material = new THREE.LineBasicMaterial({ color: colors[i], linewidth: 5});
      const points = [];
      points.push(new THREE.Vector3(0, 0, 0));
      points.push(new THREE.Vector3(0, 20, 0));
      points.push(new THREE.Vector3(0, 40, 0));
   

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, material);
      scene.add(line);
      lasers.push({ line, angle: (i / laserCount) * Math.PI * 2 });
    }

    // Animation loop
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      lasers.forEach((laser, index) => {
        const angle = laser.angle + time;
        const radius = 10 + Math.sin(time * 2 + index) * 5;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = 10 + Math.sin(time * 3 + index) * 5;

        const points = [];
        points.push(new THREE.Vector3(0, 0, 0));
        points.push(new THREE.Vector3(x, y, z));
        laser.line.geometry.setFromPoints(points);
      });

      renderer.render(scene, camera);
    }

    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
